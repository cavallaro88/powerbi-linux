name: Compatibility bug
description: Report a reproducible Fedora compatibility problem
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Remove credentials, endpoints, private paths and customer details from all attachments."
  - type: textarea
    id: environment
    attributes:
      label: Environment and doctor output
      description: "Include Fedora/GNOME or KDE version, GPU/driver, runtime, Power BI and WebView2 versions, and sanitized pbi-linux doctor --json output."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: "Describe the trigger using a synthetic PBIX/PBIP/PBIR or the provided fixtures. Specify UI versus external TMSL refresh."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
