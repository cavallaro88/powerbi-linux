name: Product checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 10
    steps:
      - name: Install check dependencies
        run: dnf install -y python3 git desktop-file-utils shared-mime-info
      - uses: actions/checkout@v4
      - name: Repeatable product checks
        run: python3 tools/check-product.py --output build/check-product/ci
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-checks-${{ github.run_id }}
          path: |
            build/check-product/ci/result.json
            build/check-product/ci/junit.xml
            build/check-product/ci/*.log
          if-no-files-found: error
          retention-days: 14
